# 劳动学时管理小程序 - 后端配置
# 阶段0：项目初始化阶段配置

server:
  port: 8080
  # 不配置 servlet.context-path；Controller 的 @RequestMapping 已统一带 /api 前缀
  # 前端 Vite 代理 /api -> 后端时保留 /api，不要 rewrite 剥离
  encoding:
    charset: UTF-8
    enabled: true
    force: true

spring:
  application:
    name: labor-management-backend
  profiles:
    active: dev

  # 数据源配置（请根据本地 MySQL 实际情况修改）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/labor_management_v2?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: hyskered6767
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.labor.management.entity
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 配置（后续阶段启用）
jwt:
  secret: labor-management-secret-key-please-change-in-production-2026
  expiration: 86400000  # 24小时（毫秒）
  header: Authorization
  token-prefix: "Bearer "

# 日志配置
logging:
  level:
    root: INFO
    com.labor.management: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 项目业务参数（后续阶段逐步启用）
labor:
  # 默认每学期课程节次要求
  default-required-sessions: 11
  # 课程封存天数（实际发生日期 + N 自然日）
  seal-days: ${LABOR_SEAL_DAYS:10}
  # 成绩权重默认值（必须总和为 100）
  weight:
    practice: 0.55
    report: 0.10
    theory: 0.15
    project: 0.20
